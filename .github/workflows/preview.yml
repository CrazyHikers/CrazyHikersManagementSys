name: Deploy preview

on:
  push:
    branches-ignore: [main]

# Cancel in-flight preview deploys when a new commit lands on the same
# branch — only the latest commit's preview matters.
concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Re-author HEAD as github-actions[bot]
        # Mirrors the production workflow: Vercel's authorship checks
        # scan git metadata (author + Co-Authored-By trailers) on the
        # HEAD commit. Amend locally so the CLI deploy attaches no
        # human-author signal. Never pushed.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --amend --reset-author -m "Preview ${GITHUB_REF_NAME}@$(echo $GITHUB_SHA | cut -c1-7)"

      - name: Deploy preview to Vercel
        id: deploy
        run: |
          URL=$(npx vercel deploy --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          {
            echo "### Preview deployed"
            echo ""
            echo "Branch: \`${GITHUB_REF_NAME}\`"
            echo "Commit: \`$(echo $GITHUB_SHA | cut -c1-7)\`"
            echo ""
            echo "**URL:** $URL"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
