name: Deploy to production

on:
  push:
    branches: [main]

# Needed to push the orphan deploy branch back to the repo.
permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mirror main to deploy branch as github-actions[bot]
        # Vercel's authorship checks scan git history at deploy time.
        # Replacing main's history with a single bot-authored orphan
        # commit on a `deploy` branch strips any human-author signal
        # the hobby-tier check flags on. The deploy branch is a
        # disposable record — force-pushed fresh on every run.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan deploy
          git commit -m "Deploy main@$(echo $GITHUB_SHA | cut -c1-7)"
          git push origin deploy --force

      - name: Deploy to Vercel
        run: npx vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
