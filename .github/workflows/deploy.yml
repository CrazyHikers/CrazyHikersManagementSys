name: Deploy to production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Re-author HEAD as github-actions[bot]
        # Vercel's authorship checks scan git metadata (and commit
        # message trailers like Co-Authored-By) on the HEAD it
        # receives. Replace HEAD with a single bot-authored orphan
        # commit so Vercel sees no human-author signal. The branch
        # is local-only and never pushed — Vercel CLI uploads the
        # working tree and attaches local HEAD metadata directly.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan deploy
          git commit -m "Deploy main@$(echo $GITHUB_SHA | cut -c1-7)"

      - name: Deploy to Vercel
        run: npx vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
