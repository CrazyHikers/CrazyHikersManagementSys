name: Deploy to production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Re-author HEAD as github-actions[bot]
        # Vercel's authorship checks scan git metadata on the HEAD
        # commit (author + message trailers like Co-Authored-By).
        # Amend HEAD with the bot identity and a fresh message so
        # the CLI deploy attaches no human-author signal. Local-
        # only — never pushed.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --amend --reset-author -m "Deploy main@$(echo $GITHUB_SHA | cut -c1-7)"

      - name: Deploy to Vercel
        run: npx vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
